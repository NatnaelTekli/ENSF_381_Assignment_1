<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
      <img src="images/logo.jpeg" alt="ice-cream logo">
      <h1>Sweet Scoop Ice Cream</h1>
  </header>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="menu_view.html">Menu</a>
  </div>
  <main>
    <img src="images/Picture2.jpeg">
    <form>
      <h2>Vanilla Dream</h2>
      <p>Choose Type</p>

      <label for="cup">Cup</label><br>
      <input type="radio" id="cup" name="type"><br>

      <label for="cone">Cone</label><br>
      <input type="radio" id="cone" name="type"><br><br>

      <button class="btn">Submit Selection</button><br><br>

      <h2>Chocolate Bliss</h2>
      <p>Select Toppings</p>

      <label for="sprinkles">Sprinkles</label><br>
      <input type="checkbox" id="sprinkles"><br>

      <label for="oreo">Oreo Crumbs</label><br>
      <input type="checkbox" id="oreo"><br>

      <label for="caramel">Caramel Drizzle</label><br>
      <input type="checkbox" id="caramel"><br><br>

      <button class="btn">Submit Selection</button><br><br><br>

      <a href="order_summary.html" class="btn">Finish Order</a>
    </form>
  </main>
  <footer>
    &#169 2026 Sweet Scoop Ice Cream. All rights reserved
  </footer>
</body>
</html>
